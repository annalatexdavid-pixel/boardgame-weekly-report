<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>桌遊產業週報</title>
<style>
  :root{
    --bg:#14110e; --bg2:#1c1813; --card:#211c16; --card2:#26201a;
    --accent:#ff8a3d; --accent2:#ffb066; --line:#3a3128;
    --text:#f3ece2; --muted:#a99b8a; --dim:#7c6f60; --good:#7bd88f;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;line-height:1.65;-webkit-font-smoothing:antialiased}
  .wrap{max-width:960px;margin:0 auto;padding:32px 20px 64px}
  header{border-bottom:2px solid var(--accent);padding-bottom:22px;margin-bottom:8px}
  .kicker{color:var(--accent);font-weight:700;letter-spacing:.18em;font-size:12px;text-transform:uppercase}
  h1{font-size:32px;font-weight:800;margin:8px 0 6px;letter-spacing:.02em}
  .range{color:var(--muted);font-size:14px}
  .range b{color:var(--accent2)}
  .intro{color:var(--muted);font-size:14px;margin:18px 0 30px;padding:14px 16px;background:var(--bg2);border-radius:10px;border-left:3px solid var(--accent)}
  section{margin:34px 0}
  .sec-head{display:flex;align-items:center;gap:12px;margin-bottom:16px}
  .sec-num{background:var(--accent);color:#1a1209;font-weight:800;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-size:15px;flex:0 0 auto}
  .sec-head h2{font-size:20px;font-weight:800}
  .sec-head .en{color:var(--dim);font-size:12px;font-weight:600;letter-spacing:.08em;margin-left:auto}
  .grid{display:grid;gap:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;transition:border-color .15s,transform .15s}
  .card:hover{border-color:var(--accent);transform:translateY(-2px)}
  .card .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:6px}
  .card h3{font-size:16px;font-weight:700;color:#fff}
  .date{color:var(--accent2);font-size:12px;font-weight:700;white-space:nowrap;flex:0 0 auto}
  .card p{color:var(--muted);font-size:14px;margin-bottom:10px}
  .src{font-size:12px;font-weight:600}
  .src a{color:var(--accent);text-decoration:none;border-bottom:1px dotted var(--accent)}
  .src a:hover{color:var(--accent2)}
  .tag{display:inline-block;font-size:11px;color:var(--dim);border:1px solid var(--line);border-radius:20px;padding:1px 9px;margin-right:6px}
  .none{color:var(--dim);font-style:italic;font-size:14px;background:var(--bg2);border:1px dashed var(--line);border-radius:10px;padding:12px 16px}
  .figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:4px}
  .fig{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:14px}
  .fig .n{font-size:22px;font-weight:800;color:var(--accent2)}
  .fig .l{font-size:12px;color:var(--muted);margin-top:2px}
  .tw{border-color:#2f4a3a}
  .tw .sec-num{background:var(--good);color:#0f1f16}
  footer{margin-top:48px;border-top:1px solid var(--line);padding-top:22px}
  footer h4{font-size:13px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-bottom:12px}
  .srclist{columns:2;column-gap:26px;font-size:12.5px}
  .srclist a{display:block;color:var(--dim);text-decoration:none;margin-bottom:7px;break-inside:avoid}
  .srclist a:hover{color:var(--accent)}
  .note{color:var(--dim);font-size:12px;margin-top:18px;line-height:1.7}
  @media(max-width:640px){.srclist{columns:1}h1{font-size:26px}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<!-- ▼▼▼ 每週只需替換這個 JSON 區塊（build 腳本會自動注入）▼▼▼ -->

10/22–25", "body": "全球最大桌遊展 SPIEL Essen 將於 10 月 22–25 日於德國 Messe Essen 舉行，2026 年首度使用全部八個展館、共 81,200 平方公尺，約 950 家參展商、預估 220,000+ 名觀眾。距今尚有時間，惟規模創新高值得關注。", "sources": [{"name": "SPIEL Essen 官方", "url": "https://www.spiel-essen.de/en/"}, {"name": "Showsbee", "url": "https://www.showsbee.com/fairs/67065-SPIEL-ESSEN-2026.html"}]}]}, {"num": "★", "title": "台灣在地動態", "en": "TAIWAN", "tw": true, "none": "本週台灣桌遊圈無突發性重大商業／併購新聞；主要動態集中於既定展會籌備與持續進行中的集資專案。", "cards": [{"tw": true, "title": "台灣新銳桌遊博覽會（TOBExpo）2026 定檔 9/25–27", "date": "9/25–27", "body": "台灣最大桌遊展台灣新銳桌遊博覽會將於 9 月 25 至 27 日舉辦，號召 80+ 家國內外出版社、上百位設計師，預計推出數百款新作，為在地團隊年度發表重心。", "sources": [{"name": "TOBExpo 官方", "url": "https://www.facebook.com/TOBEXPO/?locale=zh_TW"}, {"name": "新銳桌遊展 IG", "url": "https://www.instagram.com/taiwanbgexpo/"}]}, {"tw": true, "title": "在地募資：嘖嘖桌遊專案持續，文化題材受注目", "date": "本週", "body": "嘖嘖（zeczec）遊戲類別持續有桌遊集資案，如以台灣陣頭文化為題的《桌遊陣頭》等，反映在地創作者運用群眾集資推出文化題材作品的趨勢。TBD 台灣桌遊設計亦持續更新活動與集資觀察。", "sources": [{"name": "嘖嘖 遊戲集資", "url": "https://www.zeczec.com/categories?category=13&type=crowdfunding"}, {"name": "TBD 活動訊息", "url": "https://www.tbd.com.tw/blogs/events"}]}]}], "sources": [{"name": "Board Game Quest — 本週募資精選 7/20/26", "url": "https://www.boardgamequest.com/crowdfunding-campaigns-of-the-week-7-20-26/"}, {"name": "Meeple Mountain — Crowdfunding Roundup", "url": "https://www.meeplemountain.com/crowdfunding/"}, {"name": "BoardGameWire — JinxO 奪 Spiel des Jahres 2026", "url": "https://boardgamewire.com/index.php/2026/07/13/jinxo-wins-2026-spiel-des-jahres-rebirth-secures-historic-triple-for-reiner-knizia/"}, {"name": "ICv2 — Spiel des Jahres Winner", "url": "https://icv2.com/articles/news/view/62835/spiel-des-jahres-winner-announced"}, {"name": "BoardGameWire — Osprey Games 出售案", "url": "https://boardgamewire.com/index.php/2026/05/13/undaunted-publisher-ospreys-board-game-operation-to-be-sold-off-by-owner-bloomsbury-publishing/"}, {"name": "PC Gamer — Slitherine 取得 Blood Bowl 授權", "url": "https://www.pcgamer.com/games/sports/blood-bowls-videogame-rights-have-been-acquired-by-slitherine-and-at-this-point-ill-take-any-change-as-a-good-sign/"}, {"name": "Tabletop Battles — 產業新聞彙整 7/7", "url": "https://www.tabletopbattles.com/games-industry-news-roundup-july-7th-2026"}, {"name": "Gen Con Indy 2026 官方", "url": "https://www.gencon.com/"}, {"name": "FanCons — Gen Con 2026 資訊", "url": "https://fancons.com/events/info/26507/gen-con-2026"}, {"name": "SPIEL Essen 2026 官方", "url": "https://www.spiel-essen.de/en/"}, {"name": "Showsbee — SPIEL Essen 2026", "url": "https://www.showsbee.com/fairs/67065-SPIEL-ESSEN-2026.html"}, {"name": "Coherent Market Insights — 市場規模", "url": "https://www.coherentmarketinsights.com/industry-reports/board-game-market"}, {"name": "Fortune Business Insights — 市場規模", "url": "https://www.fortunebusinessinsights.com/board-games-market-104972"}, {"name": "Polaris Market Research — 市場規模", "url": "https://www.polarismarketresearch.com/industry-analysis/board-games-market"}, {"name": "台灣新銳桌遊博覽會 TOBExpo", "url": "https://www.facebook.com/TOBEXPO/?locale=zh_TW"}, {"name": "新銳桌遊展 Instagram", "url": "https://www.instagram.com/taiwanbgexpo/"}, {"name": "嘖嘖 zeczec — 遊戲集資", "url": "https://www.zeczec.com/categories?category=13&type=crowdfunding"}, {"name": "TBD 台灣桌遊設計 — 活動訊息", "url": "https://www.tbd.com.tw/blogs/events"}], "footnote": "本週報由自動化任務彙整自公開網路來源，報導區間為 2026/07/21–07/27（部分具指標意義之近期消息如 Spiel des Jahres、Blood Bowl 授權亦納入並標註實際日期）。市場規模數字為第三方市調機構之預測值，各家口徑不同、區間差距大，僅供趨勢參考，不代表實際銷售。連結有效性以來源網站為準。"}</script>

<script>
(function(){
  const D = JSON.parse(document.getElementById('report-data').textContent);
  const esc = s => String(s==null?'':s);
  const badge = accent => accent ? '<span class="tag">'+esc(accent)+'</span>' : '';

  function srcLine(sources){
    if(!sources || !sources.length) return '';
    return '<div class="src">來源：' +
      sources.map(s=>'<a href="'+esc(s.url)+'" target="_blank">'+esc(s.name)+'</a>').join(' · ') +
      '</div>';
  }
  function figs(items){
    if(!items || !items.length) return '';
    return '<div class="figs">' + items.map(f=>
      '<div class="fig"><div class="n">'+esc(f.value)+'</div><div class="l">'+esc(f.label)+'</div></div>'
    ).join('') + '</div>';
  }
  function card(c){
    return '<div class="card'+(c.tw?' tw':'')+'">'+
      '<div class="top"><h3>'+esc(c.title)+'</h3>'+(c.date?'<span class="date">'+esc(c.date)+'</span>':'')+'</div>'+
      (c.tag?'<p>'+badge(c.tag)+esc(c.body)+'</p>':(c.body?'<p>'+esc(c.body)+'</p>':''))+
      figs(c.figs)+
      (c.foot?'<p style="margin-top:12px;font-size:13px;color:var(--dim)">'+esc(c.foot)+'</p>':'')+
      srcLine(c.sources)+
    '</div>';
  }
  function section(s){
    const cards = (s.cards||[]).map(card).join('');
    const none = s.none ? '<div class="none">'+esc(s.none)+'</div>' : '';
    return '<section><div class="sec-head'+(s.tw?' tw':'')+'">'+
      '<div class="sec-num">'+esc(s.num)+'</div><h2>'+esc(s.title)+'</h2>'+
      '<div class="en">'+esc(s.en||'')+'</div></div>'+
      '<div class="grid">'+cards+none+'</div></section>';
  }

  const allSources = D.sources || [];
  const footerSources = allSources.map(s=>
    '<a href="'+esc(s.url)+'" target="_blank">'+esc(s.name)+'</a>').join('');

  document.getElementById('app').innerHTML =
    '<header>'+
      '<div class="kicker">◆ 桌遊產業週報 · Board Game Industry Weekly</div>'+
      '<h1>'+esc(D.headline||'本週桌遊產業速覽')+'</h1>'+
      '<div class="range">報導區間：<b>'+esc(D.range)+'</b>　·　產出日期：'+esc(D.date)+'</div>'+
    '</header>'+
    (D.intro?'<div class="intro">'+D.intro+'</div>':'')+
    (D.sections||[]).map(section).join('')+
    '<footer><h4>本期所有來源連結</h4><div class="srclist">'+footerSources+'</div>'+
    (D.footnote?'<p class="note">'+esc(D.footnote)+'</p>':'')+'</footer>';

  document.title = '桌遊產業週報 · '+esc(D.range||'');
})();
</script>
</body>
</html>
