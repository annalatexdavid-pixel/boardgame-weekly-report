<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>桌遊產業週報 · 首頁</title>
<style>
  :root{
    --bg:#e5e4e0; --bg2:#dad9d4; --card:#f5f4f1; --card2:#ececea;
    --accent:#e2691a; --accent2:#b8500f; --line:#c3c1ba;
    --text:#1a1917; --muted:#57544e; --dim:#87837b; --good:#b8500f;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;line-height:1.65}
  .wrap{max-width:820px;margin:0 auto;padding:48px 20px 72px}
  header{border-bottom:2px solid var(--accent);padding-bottom:24px;margin-bottom:8px}
  .kicker{color:var(--accent);font-weight:700;letter-spacing:.18em;font-size:12px;text-transform:uppercase}
  h1{font-size:36px;font-weight:800;margin:10px 0 8px}
  .sub{color:var(--muted);font-size:15px;max-width:620px}
  .latest-label{color:var(--accent2);font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;margin:34px 0 10px}
  .card{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 22px;margin-bottom:14px;transition:border-color .15s,transform .15s}
  .card:hover{border-color:var(--accent);transform:translateY(-2px)}
  .card.big{background:linear-gradient(135deg,#f5f4f1,#ececea);border-color:var(--accent);border-width:1.5px}
  .card .row{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
  .card h2{font-size:19px;font-weight:800;color:var(--text)}
  .card.big h2{font-size:23px}
  .date{color:var(--accent2);font-size:13px;font-weight:700;white-space:nowrap;flex:0 0 auto}
  .range{color:var(--muted);font-size:13px;margin-top:2px}
  .summary{color:var(--dim);font-size:13.5px;margin-top:8px}
  .arch-label{color:var(--muted);font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;margin:30px 0 10px}
  .empty{color:var(--dim);font-style:italic;background:var(--bg2);border:1px dashed var(--line);border-radius:10px;padding:16px}
  footer{margin-top:44px;border-top:1px solid var(--line);padding-top:18px;color:var(--dim);font-size:12px;line-height:1.7}
  @media(max-width:600px){h1{font-size:28px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="kicker">◆ Board Game Industry Weekly</div>
    <h1>桌遊產業週報</h1>
    <p class="sub">每週彙整國際與台灣桌遊產業動態：市場規模與趨勢、熱門新品與募資、產業公司與商業、展會與活動。資料來源皆附連結。</p>
  </header>

  <div id="latest"></div>
  <div id="archive"></div>

  <footer>
    自動彙整自公開網路來源，僅供參考；市場數字為第三方預測值，各家口徑不同。 ·
    由 Cowork 每週產生資料，Git 發佈於 GitHub Pages。
  </footer>
</div>

<script>
(function(){
  fetch('reports.json?_=' + Date.now())
    .then(r => r.ok ? r.json() : [])
    .then(list => render(Array.isArray(list) ? list : []))
    .catch(() => render([]));

  function esc(s){return String(s==null?'':s).replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));}

  function card(m, big){
    return '<a class="card'+(big?' big':'')+'" href="'+esc(m.file)+'">'+
      '<div class="row"><h2>'+esc(m.headline||'桌遊產業週報')+'</h2><span class="date">'+esc(m.date)+'</span></div>'+
      (m.range?'<div class="range">'+esc(m.range)+'</div>':'')+
      (m.summary?'<div class="summary">'+esc(m.summary)+'</div>':'')+
    '</a>';
  }

  function render(list){
    var latest = document.getElementById('latest');
    var archive = document.getElementById('archive');
    if(!list.length){
      latest.innerHTML = '<div class="empty">尚無報告。跑一次 build 產生第一期後即會顯示於此。</div>';
      return;
    }
    latest.innerHTML = '<div class="latest-label">最新一期</div>' + card(list[0], true);
    if(list.length > 1){
      archive.innerHTML = '<div class="arch-label">往期回顧</div>' +
        list.slice(1).map(m => card(m, false)).join('');
    }
  }
})();
</script>
</body>
</html>
