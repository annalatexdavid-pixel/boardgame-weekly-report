<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>桌遊產業週報</title>
<style>
  :root{
    --bg:#e5e4e0; --bg2:#dad9d4; --card:#f5f4f1; --card2:#ececea;
    --accent:#9c1c1c; --accent2:#701414; --line:#c3c1ba;
    --text:#1a1917; --muted:#57544e; --dim:#87837b; --good:#701414;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;line-height:1.65;-webkit-font-smoothing:antialiased}
  .wrap{max-width:960px;margin:0 auto;padding:32px 20px 64px}
  header{border-bottom:2px solid var(--accent);padding-bottom:22px;margin-bottom:8px}
  .kicker{color:var(--accent);font-weight:700;letter-spacing:.18em;font-size:12px;text-transform:uppercase}
  h1{font-size:32px;font-weight:800;margin:8px 0 6px;letter-spacing:.02em}
  .range{color:var(--muted);font-size:14px}
  .range b{color:var(--accent2)}
  .intro{color:var(--muted);font-size:14px;margin:18px 0 30px;padding:14px 16px;background:var(--bg2);border-radius:10px;border-left:3px solid var(--accent)}
  section{margin:34px 0}
  .sec-head{display:flex;align-items:center;gap:12px;margin-bottom:16px}
  .sec-num{background:var(--accent);color:#ffffff;font-weight:800;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-size:15px;flex:0 0 auto}
  .sec-head h2{font-size:20px;font-weight:800}
  .sec-head .en{color:var(--dim);font-size:12px;font-weight:600;letter-spacing:.08em;margin-left:auto}
  .grid{display:grid;gap:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;transition:border-color .15s,transform .15s}
  .card:hover{border-color:var(--accent);transform:translateY(-2px)}
  .card .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:6px}
  .card h3{font-size:16px;font-weight:700;color:var(--text)}
  .date{color:var(--accent2);font-size:12px;font-weight:700;white-space:nowrap;flex:0 0 auto}
  .card p{color:var(--muted);font-size:14px;margin-bottom:10px}
  .src{font-size:12px;font-weight:600}
  .src a{color:var(--accent);text-decoration:none;border-bottom:1px dotted var(--accent)}
  .src a:hover{color:var(--accent2)}
  .tag{display:inline-block;font-size:11px;color:var(--dim);border:1px solid var(--line);border-radius:20px;padding:1px 9px;margin-right:6px}
  .none{color:var(--dim);font-style:italic;font-size:14px;background:var(--bg2);border:1px dashed var(--line);border-radius:10px;padding:12px 16px}
  .figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:4px}
  .fig{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:14px}
  .fig .n{font-size:22px;font-weight:800;color:var(--accent2)}
  .fig .l{font-size:12px;color:var(--muted);margin-top:2px}
  .tw{border-color:var(--accent2)}
  .tw .sec-num{background:var(--good);color:#ffffff}
  footer{margin-top:48px;border-top:1px solid var(--line);padding-top:22px}
  footer h4{font-size:13px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-bottom:12px}
  .srclist{columns:2;column-gap:26px;font-size:12.5px}
  .srclist a{display:block;color:var(--dim);text-decoration:none;margin-bottom:7px;break-inside:avoid}
  .srclist a:hover{color:var(--accent)}
  .note{color:var(--dim);font-size:12px;margin-top:18px;line-height:1.7}
  @media(max-width:640px){.srclist{columns:1}h1{font-size:26px}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<!-- ▼▼▼ 每週只需替換這個 JSON 區塊（build 腳本會自動注入）▼▼▼ -->
<script id="report-data" type="application/json">__DATA_JSON__</script>
<!-- ▲▲▲ 以上為唯一需要更新的部分；下方框架與樣式每週不變 ▲▲▲ -->

<script>
(function(){
  const D = JSON.parse(document.getElementById('report-data').textContent);
  const esc = s => String(s==null?'':s);
  const badge = accent => accent ? '<span class="tag">'+esc(accent)+'</span>' : '';

  function srcLine(sources){
    if(!sources || !sources.length) return '';
    return '<div class="src">來源：' +
      sources.map(s=>'<a href="'+esc(s.url)+'" target="_blank">'+esc(s.name)+'</a>').join(' · ') +
      '</div>';
  }
  function figs(items){
    if(!items || !items.length) return '';
    return '<div class="figs">' + items.map(f=>
      '<div class="fig"><div class="n">'+esc(f.value)+'</div><div class="l">'+esc(f.label)+'</div></div>'
    ).join('') + '</div>';
  }
  function card(c){
    return '<div class="card'+(c.tw?' tw':'')+'">'+
      '<div class="top"><h3>'+esc(c.title)+'</h3>'+(c.date?'<span class="date">'+esc(c.date)+'</span>':'')+'</div>'+
      (c.tag?'<p>'+badge(c.tag)+esc(c.body)+'</p>':(c.body?'<p>'+esc(c.body)+'</p>':''))+
      figs(c.figs)+
      (c.foot?'<p style="margin-top:12px;font-size:13px;color:var(--dim)">'+esc(c.foot)+'</p>':'')+
      srcLine(c.sources)+
    '</div>';
  }
  function section(s){
    const cards = (s.cards||[]).map(card).join('');
    const none = s.none ? '<div class="none">'+esc(s.none)+'</div>' : '';
    return '<section><div class="sec-head'+(s.tw?' tw':'')+'">'+
      '<div class="sec-num">'+esc(s.num)+'</div><h2>'+esc(s.title)+'</h2>'+
      '<div class="en">'+esc(s.en||'')+'</div></div>'+
      '<div class="grid">'+cards+none+'</div></section>';
  }

  const allSources = D.sources || [];
  const footerSources = allSources.map(s=>
    '<a href="'+esc(s.url)+'" target="_blank">'+esc(s.name)+'</a>').join('');

  document.getElementById('app').innerHTML =
    '<header>'+
      '<div class="kicker">◆ 桌遊產業週報 · Board Game Industry Weekly</div>'+
      '<h1>'+esc(D.headline||'本週桌遊產業速覽')+'</h1>'+
      '<div class="range">報導區間：<b>'+esc(D.range)+'</b>　·　產出日期：'+esc(D.date)+'</div>'+
    '</header>'+
    (D.intro?'<div class="intro">'+D.intro+'</div>':'')+
    (D.sections||[]).map(section).join('')+
    '<footer><h4>本期所有來源連結</h4><div class="srclist">'+footerSources+'</div>'+
    (D.footnote?'<p class="note">'+esc(D.footnote)+'</p>':'')+'</footer>';

  document.title = '桌遊產業週報 · '+esc(D.range||'');
})();
</script>
</body>
</html>
